<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Hamza Demir - Machine Learning Engineer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120a08"/>
      <stop offset="0.38" stop-color="#4a1d10"/>
      <stop offset="0.66" stop-color="#b4502a"/>
      <stop offset="0.84" stop-color="#e79a52"/>
      <stop offset="1" stop-color="#f6cf8e"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0705" stop-opacity="0.82"/>
      <stop offset="0.5" stop-color="#0d0705" stop-opacity="0.28"/>
      <stop offset="0.8" stop-color="#0d0705" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="0.7" stop-color="#ffd58a"/>
      <stop offset="1" stop-color="#f7a94f"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#f08a3c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f08a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d07a41"/>
      <stop offset="1" stop-color="#a04a24"/>
    </linearGradient>
    <linearGradient id="midLit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0a055"/>
      <stop offset="1" stop-color="#b9572a"/>
    </linearGradient>
    <linearGradient id="midDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3219"/>
      <stop offset="1" stop-color="#4f1d0f"/>
    </linearGradient>
    <linearGradient id="nearLit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9642f"/>
      <stop offset="1" stop-color="#6d2a14"/>
    </linearGradient>
    <linearGradient id="nearDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a160c"/>
      <stop offset="1" stop-color="#170907"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#ffd9a0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <clipPath id="midDunes">
      <path d="M0 356 C160 326 300 300 452 276 C560 300 650 330 760 356 C900 372 1100 366 1280 344 L1280 440 L0 440 Z"/>
      <path d="M760 356 C900 318 1030 300 1150 290 C1200 304 1245 322 1280 334 L1280 440 L700 440 Z"/>
    </clipPath>
    <clipPath id="frame"><rect width="1280" height="440" rx="18"/></clipPath>
    <style>
      .name { font: 300 62px "Helvetica Neue", "Segoe UI", Arial, sans-serif; letter-spacing: 15px; fill: #fff3dc; }
      .role { font: 500 15px "Helvetica Neue", "Segoe UI", Arial, sans-serif; letter-spacing: 6.5px; fill: #f3b56b; }
      .tag  { font: 400 15px "Helvetica Neue", "Segoe UI", Arial, sans-serif; letter-spacing: 0.6px; fill: #ecd3b0; }
      .star { fill: #ffe9c4; animation: tw 4s ease-in-out infinite; }
      .s2 { animation-delay: 1.3s; } .s3 { animation-delay: 2.6s; }
      .wind { fill: none; stroke: #ffe2ae; stroke-linecap: round; stroke-dasharray: 90 520; animation: drift 9s linear infinite; }
      .w2 { animation-duration: 13s; animation-delay: -4s; } .w3 { animation-duration: 11s; animation-delay: -7s; }
      .grain { fill: #ffe2ae; animation: blow 8s linear infinite; }
      .g2 { animation-duration: 11s; animation-delay: -3s; } .g3 { animation-duration: 14s; animation-delay: -6s; }
      .pulse { animation: breathe 7s ease-in-out infinite; transform-origin: 955px 262px; }
      .rise { animation: in 1.6s ease-out both; }
      .r2 { animation-delay: .35s; } .r3 { animation-delay: .7s; }
      .contour { fill: none; stroke: #ffdca6; stroke-width: 1; }
      .trail { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; animation: descend 12s ease-in-out infinite; }
      .step { fill: #fff1c9; animation: step 12s ease-in-out infinite; }
      .minimum { animation: found 12s ease-in-out infinite; transform-origin: 800px 392px; }
      @keyframes descend { 0% { stroke-dashoffset: 1; opacity: 1 } 55%,88% { stroke-dashoffset: 0; opacity: 1 } 100% { stroke-dashoffset: 0; opacity: 0 } }
      @keyframes step { 0%,100% { opacity: 0 } 55%,88% { opacity: .95 } }
      @keyframes found { 0%,50%,100% { opacity: 0; transform: scale(.4) } 62% { opacity: 1; transform: scale(1.25) } 74%,88% { opacity: .9; transform: scale(1) } }
      @keyframes tw { 0%,100% { opacity: .25 } 50% { opacity: .95 } }
      @keyframes drift { from { stroke-dashoffset: 610 } to { stroke-dashoffset: 0 } }
      @keyframes blow { from { transform: translate(-80px, 6px); opacity: 0 } 15% { opacity: .8 } 85% { opacity: .6 } to { transform: translate(1400px, -26px); opacity: 0 } }
      @keyframes breathe { 0%,100% { transform: scale(1); opacity: .85 } 50% { transform: scale(1.07); opacity: 1 } }
      @keyframes in { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="url(#sky)"/>

    <g>
      <circle class="star" cx="118" cy="46" r="1.3"/><circle class="star s2" cx="262" cy="92" r="1"/>
      <circle class="star s3" cx="388" cy="38" r="1.4"/><circle class="star" cx="520" cy="74" r="1"/>
      <circle class="star s2" cx="644" cy="30" r="1.2"/><circle class="star s3" cx="742" cy="98" r="0.9"/>
      <circle class="star" cx="842" cy="44" r="1.3"/><circle class="star s2" cx="1010" cy="66" r="1"/>
      <circle class="star s3" cx="1122" cy="34" r="1.4"/><circle class="star" cx="1214" cy="104" r="1"/>
      <circle class="star s2" cx="186" cy="134" r="0.9"/><circle class="star s3" cx="1066" cy="128" r="0.9"/>
    </g>

    <circle class="pulse" cx="955" cy="262" r="250" fill="url(#glow)"/>
    <circle cx="955" cy="262" r="96" fill="url(#sun)" filter="url(#soft)"/>

    <path d="M0 300 C140 262 250 284 370 296 C470 262 560 250 660 286 C760 262 880 272 980 294 C1080 266 1190 262 1280 284 L1280 440 L0 440 Z" fill="url(#far)" opacity="0.9"/>
    <rect y="262" width="1280" height="90" fill="url(#haze)"/>

    <path d="M0 356 C160 326 300 300 452 276 C560 300 650 330 760 356 C900 372 1100 366 1280 344 L1280 440 L0 440 Z" fill="url(#midDark)"/>
    <path d="M452 276 C560 300 650 330 760 356 C640 372 500 384 330 390 C380 350 420 310 452 276 Z" fill="url(#midLit)"/>
    <path d="M760 356 C900 318 1030 300 1150 290 C1200 304 1245 322 1280 334 L1280 440 L700 440 Z" fill="url(#midDark)"/>
    <path d="M1150 290 C1200 304 1245 322 1280 334 L1280 440 L1040 440 C1090 392 1126 340 1150 290 Z" fill="url(#midLit)"/>

    <g fill="#1a0a06">
      <ellipse cx="452" cy="268.5" rx="1.9" ry="6"/><circle cx="452" cy="260.6" r="1.9"/>
    </g>

    <g clip-path="url(#midDunes)"><ellipse class="contour" cx="800" cy="392" rx="34" ry="6.8" opacity="0.5"/><ellipse class="contour" cx="800" cy="392" rx="78" ry="15.6" opacity="0.42"/><ellipse class="contour" cx="800" cy="392" rx="130" ry="26.0" opacity="0.36"/><ellipse class="contour" cx="800" cy="392" rx="190" ry="38.0" opacity="0.3"/><ellipse class="contour" cx="800" cy="392" rx="258" ry="51.6" opacity="0.25"/><ellipse class="contour" cx="800" cy="392" rx="334" ry="66.8" opacity="0.2"/><ellipse class="contour" cx="800" cy="392" rx="418" ry="83.6" opacity="0.16"/><ellipse class="contour" cx="800" cy="392" rx="510" ry="102.0" opacity="0.12"/></g>

    <path d="M0 440 L0 392 C130 372 250 350 356 330 C470 362 600 398 760 418 C930 432 1110 428 1280 404 L1280 440 Z" fill="url(#nearDark)"/>
    <path d="M356 330 C470 362 600 398 760 418 C600 432 420 438 250 440 C300 400 334 364 356 330 Z" fill="url(#nearLit)" opacity="0.95"/>
    <path d="M0 392 C130 372 250 350 356 330 C470 362 600 398 760 418" fill="none" stroke="#ffc27a" stroke-width="1.4" opacity="0.85"/>

    <g>
      <path class="trail" pathLength="1" d="M452 277 L516 300 L566 326 L634 338 L684 362 L732 370 L772 387 L800 392" stroke="#ffb74d" stroke-width="7" opacity="0.5" filter="url(#soft)"/>
      <path class="trail" pathLength="1" d="M452 277 L516 300 L566 326 L634 338 L684 362 L732 370 L772 387 L800 392" stroke="#fff3d6" stroke-width="2"/>
      <circle class="step" cx="516" cy="300" r="2.6"/><circle class="step" cx="566" cy="326" r="2.6"/><circle class="step" cx="634" cy="338" r="2.6"/><circle class="step" cx="684" cy="362" r="2.6"/><circle class="step" cx="732" cy="370" r="2.6"/><circle class="step" cx="772" cy="387" r="2.6"/>
      <g class="minimum">
        <circle cx="800" cy="392" r="22" fill="url(#glow)"/>
        <path d="M800 379 L803 389 L813 392 L803 395 L800 405 L797 395 L787 392 L797 389 Z" fill="#fff6dc"/>
      </g>
    </g>

    <path class="wind" stroke-width="1.2" opacity="0.55" d="M-40 318 C240 296 520 330 800 304 S1180 292 1340 306"/>
    <path class="wind w2" stroke-width="0.9" opacity="0.4" d="M-40 368 C260 348 540 388 840 360 S1200 348 1340 362"/>
    <path class="wind w3" stroke-width="0.8" opacity="0.35" d="M-40 262 C300 246 600 274 900 252 S1220 246 1340 256"/>

    <circle class="grain" cx="0" cy="300" r="1.3"/><circle class="grain g2" cx="0" cy="340" r="1"/>
    <circle class="grain g3" cx="0" cy="376" r="1.5"/><circle class="grain g2" cx="0" cy="282" r="0.9"/>
    <circle class="grain g3" cx="0" cy="322" r="1.1"/><circle class="grain" cx="0" cy="402" r="1.2"/>

    <rect width="1280" height="440" fill="url(#shade)"/>

    <g>
      <rect class="rise" x="82" y="96" width="46" height="2" fill="#f3b56b"/>
      <text class="role rise" x="82" y="132">MACHINE LEARNING ENGINEER</text>
      <text class="name rise r2" x="78" y="206">HAMZA DEMİR</text>
      <text class="tag rise r3" x="82" y="246">Machine Learning · Deep Learning · Data Science · Computer Vision</text>
    </g>
  </g>
</svg>
