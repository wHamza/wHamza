<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Hamza Demir, AI / ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5">
        <animate attributeName="stop-color" values="#4f46e5;#7c3aed;#db2777;#4f46e5" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#db2777;#f97316;#7c3aed" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f97316">
        <animate attributeName="stop-color" values="#f97316;#4f46e5;#7c3aed;#f97316" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter>
    <clipPath id="round"><rect width="1000" height="260" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <g filter="url(#soft)" opacity="0.55">
      <circle cx="170" cy="40" r="90" fill="#22d3ee"/>
      <circle cx="860" cy="220" r="110" fill="#fde047"/>
    </g>
    <!-- graph motif: nodes and edges, a nod to graph ML -->
    <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" fill="none">
      <path d="M700 60 L790 110 L880 70 L930 150 L840 190 L790 110 M840 190 L740 200 L700 60"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.85">
      <circle cx="700" cy="60" r="6"/><circle cx="790" cy="110" r="8"/><circle cx="880" cy="70" r="6"/>
      <circle cx="930" cy="150" r="7"/><circle cx="840" cy="190" r="6"/><circle cx="740" cy="200" r="5"/>
    </g>
    <text x="64" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff">Hamza Demir</text>
    <text x="68" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#ffffff" fill-opacity="0.92">AI / ML Engineer</text>
    <text x="68" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" fill-opacity="0.8">Graph ML  ·  Retrieval  ·  Computer Vision  ·  Video Compression</text>
  </g>
</svg>
